<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zoo de Bouzel</title>
    <link rel="icon" type="image/png" href="Autres/logo.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <header>
        <div id="logo_nom">
            <img id="logo_header" src="Autres/logo.png">
            <p class= "in_header_footer">Zoo de Bouzel</p>
        </div>
        <p><a class= "in_header_footer" href="index.html">Accueil</a></p>
    </header>
    <h1>Présentation du Zoo</h1>
    <video controls width="500" controls preload="metadata">
        <source src="Autres/vidéo - me at the zoo.mp4" type="video/mp4" controls width="250"/>
        <track
            label="Français"
            kind="subtitles"
            srclang="fr"
            src="Autres/sout-titre francais.vtt"
            default>
        <track
            label="Japanese"
            kind="subtitles"
            srclang="jap"
            src="Autres/sous-titre japonais.vtt">
    </video>
    <footer>
        <p class= "in_header_footer">Clément, Toan, Gabriel, Jalan</p>
        <script src="js/theme-changer.js" defer></script>
        
    </footer>
</body>
</html>
